version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: online-banking-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_DB=bankdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - banking-network

  app:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: online-banking-app
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/bankdb
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres123
      - DB_DRIVER=org.postgresql.Driver
      - DB_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - PORT=8080
      - APP_BASE_URL=http://localhost:8080
      - MAIL_USERNAME=${MAIL_USERNAME:-your-email@gmail.com}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-your-app-password}
      - FLYWAY_ENABLED=true
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - banking-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  banking-network:
    driver: bridge
